  max_size: 200
  max_age: 30
  max_backups: 7
redis:
  host: "localhost"
  port: 6379
  db: 0
snowflake:
  start_time: "2026-07-24 00:00:00"
  machine_id: 1
jwt:
  secret: "replace-with-at-least-32-random-characters"